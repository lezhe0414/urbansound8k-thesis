run_name: cnn_aug_smoke
seed: 42

data:
  processed_dir: data/processed/urbansound8k_mels
  num_classes: 10
  val_fold_offset: 1
  preload: true
  max_train_samples: 256
  max_val_samples: 128
  max_test_samples: 128

model:
  name: cnn
  in_channels: 1
  num_classes: 10
  dropout: 0.35
  spatial_dropout: 0.05

training:
  batch_size: 32
  epochs: 1
  learning_rate: 0.00045
  weight_decay: 0.001
  label_smoothing: 0.03
  class_weighting:
    enabled: true
    power: 0.5
  class_aware_sampling:
    enabled: true
    power: 0.5
  scheduler:
    name: cosine
    min_learning_rate: 0.00001
  augmentation:
    enabled: true
    time_shift:
      probability: 0.50
      max_frames: 18
    frequency_shift:
      probability: 0.15
      max_bins: 2
    time_stretch:
      probability: 0.20
      min_rate: 0.90
      max_rate: 1.10
    gain:
      probability: 0.30
      min_scale: 0.85
      max_scale: 1.15
    noise:
      probability: 0.25
      std: 0.020
    spec_augment:
      probability: 0.50
      frequency_mask_param: 8
      time_mask_param: 20
      num_frequency_masks: 1
      num_time_masks: 1
  batch_mix:
    enabled: true
    mode: random
    probability: 1.00
    mixup_probability: 0.50
    mixup_alpha: 0.20
    cutmix_alpha: 1.00
  num_workers: 0
  device: cpu

outputs:
  results_dir: results
  figures_dir: figures
