run_name: cnn_aug_control
seed: 42

data:
  processed_dir: data/processed/urbansound8k_mels
  num_classes: 10
  val_fold_offset: 1

model:
  name: cnn
  in_channels: 1
  num_classes: 10
  dropout: 0.35
  spatial_dropout: 0.05

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.00045
  weight_decay: 0.001
  label_smoothing: 0.03
  class_weighting:
    enabled: true
    power: 0.5
  class_aware_sampling:
    enabled: true
    power: 0.5
  scheduler:
    name: cosine
    min_learning_rate: 0.00001
  augmentation:
    enabled: false
  batch_mix:
    enabled: false
  num_workers: 0
  device: auto

outputs:
  results_dir: results
  figures_dir: figures

evaluation:
  run_test: false
