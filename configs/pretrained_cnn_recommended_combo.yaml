run_name: pretrained_cnn_mn10_rec_combo
seed: 42

data:
  raw_dir: data/raw/UrbanSound8K_soundata
  waveform_cache_dir: data/processed/urbansound8k_waveforms_32k_5s
  require_waveform_cache: true
  sample_rate: 32000
  clip_duration_seconds: 5.0
  num_classes: 10
  development_folds: [1, 4, 7]
  sealed_test_fold: 10

model:
  name: pretrained_efficientat
  num_classes: 10
  variant: mn10_as
  pretrained: true
  checkpoint_url: https://github.com/fschmid56/EfficientAT/releases/download/v0.0.1/mn10_as_mAP_471.pt
  model_cache_dir: .model_cache/efficientat
  stage: partial_finetune
  partial_last_blocks: 3
  frontend_augmentation: false
  sample_rate: 32000
  win_length: 800
  hop_size: 320
  n_fft: 1024
  n_mels: 128
  fmin: 0.0
  fmax: null
  frequency_mask_param: 0
  time_mask_param: 0
  fmin_aug_range: 1
  fmax_aug_range: 1

training:
  batch_size: 32
  epochs: 8
  initial_checkpoint_template: results/pretrained_cnn_mn10_linear_probe_v1/valfold{val_fold}/best_model.pt
  encoder_learning_rate: 0.00002
  head_learning_rate: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.0
  class_weighting:
    enabled: true
    power: 0.5
  class_aware_sampling:
    enabled: true
    power: 0.5
  gradual_unfreezing:
    enabled: false
    head_only_epochs: 0
  mixup:
    enabled: true
    probability: 0.5
    alpha: 0.15
  waveform_augmentation:
    enabled: true
    clamp: true
    time_shift:
      enabled: true
      probability: 0.5
      max_seconds: 0.5
    gain:
      enabled: true
      probability: 0.5
      min_db: -3.0
      max_db: 3.0
    gaussian_noise:
      enabled: true
      probability: 0.25
      min_snr_db: 25.0
      max_snr_db: 40.0
  scheduler:
    name: none
  mixed_precision: true
  num_workers: 4
  pin_memory: true
  device: auto

outputs:
  results_dir: results

evaluation:
  locked_for_test: false

