run_name: cnn_aug_light
seed: 42

data:
  processed_dir: data/processed/urbansound8k_mels
  num_classes: 10
  val_fold_offset: 1

model:
  name: cnn
  in_channels: 1
  num_classes: 10
  dropout: 0.35
  spatial_dropout: 0.05

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.00045
  weight_decay: 0.001
  label_smoothing: 0.03
  class_weighting:
    enabled: true
    power: 0.5
  class_aware_sampling:
    enabled: true
    power: 0.5
  scheduler:
    name: cosine
    min_learning_rate: 0.00001
  augmentation:
    enabled: true
    time_shift:
      probability: 0.35
      max_frames: 12
    time_stretch:
      probability: 0.10
      min_rate: 0.95
      max_rate: 1.05
    gain:
      probability: 0.20
      min_scale: 0.90
      max_scale: 1.10
    noise:
      probability: 0.15
      std: 0.015
    spec_augment:
      probability: 0.30
      frequency_mask_param: 6
      time_mask_param: 14
      num_frequency_masks: 1
      num_time_masks: 1
  batch_mix:
    enabled: true
    mode: mixup
    probability: 0.15
    mixup_alpha: 0.20
  num_workers: 0
  device: auto

outputs:
  results_dir: results
  figures_dir: figures

evaluation:
  run_test: false
